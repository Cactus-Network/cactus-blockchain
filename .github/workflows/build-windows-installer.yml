name: 📦🚀 Build Installer - Windows EXE

on:
  push:
    tags: ["**"]
    branches: ["main", "chia-2.7.3-port"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build EXE (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install cactus-blockchain
        uses: ./.github/actions/install
        with:
          python-version: "3.12"
          development: "true"
        env:
          PIP_EXTRA_INDEX_URL: https://pypi.chia.net/simple/

      - name: Set installer version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "CACTUS_INSTALLER_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "CACTUS_INSTALLER_VERSION=0.0.0" >> "$GITHUB_ENV"
          fi

      - name: Build GUI
        # HAS_SIGNING_SECRET is unset -> signing steps are skipped
        shell: pwsh
        run: |
          .\venv\Scripts\Activate.ps1
          cd build_scripts
          .\build_windows-1-gui.ps1

      - name: Build installer
        shell: pwsh
        run: |
          .\venv\Scripts\Activate.ps1
          cd build_scripts
          .\build_windows-2-installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: cactus-installers-windows-x64
          path: build_scripts/final_installer/

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: build_scripts/final_installer/*
