name: 📦🚀 Build Installer - Windows EXE

on:
  push:
    tags: ["**"]
    branches: ["main", "chia-2.7.3-port"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build EXE (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version-file: "cactus-blockchain-gui/.nvmrc"

      - name: Install cactus-blockchain
        uses: ./.github/actions/install
        with:
          python-version: "3.12"
          development: "true"
        env:
          PIP_EXTRA_INDEX_URL: https://pypi.chia.net/simple/

      - name: Set installer version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "CACTUS_INSTALLER_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            # Match the version the bundled daemon reports so the GUI does not
            # show its mismatched-versions warning on untagged builds
            # (PEP440 2.5.1.dev1 -> semver 2.5.1-dev1; both compare equal in the GUI).
            PKG_VERSION=$(venv/Scripts/python -c "import importlib.metadata as m; print(m.version('cactus-blockchain'))")
            echo "CACTUS_INSTALLER_VERSION=$(echo "$PKG_VERSION" | sed 's/\.dev/-dev/')" >> "$GITHUB_ENV"
          fi

      - name: Get madmax plotter
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Cactus-Network's plotter forks are gone; madmax/bladebit are
          # network-agnostic, so bundle Chia's builds under the names the
          # cactus.plotters code expects.
          LATEST_MADMAX=$(gh api repos/Chia-Network/chia-plotter-madmax/releases/latest --jq 'select(.prerelease == false) | .tag_name')
          mkdir -p "$GITHUB_WORKSPACE/madmax"
          gh release download -R Chia-Network/chia-plotter-madmax "$LATEST_MADMAX" -p 'chia_plot-*.exe' -O "$GITHUB_WORKSPACE/madmax/cactus_plot.exe"
          gh release download -R Chia-Network/chia-plotter-madmax "$LATEST_MADMAX" -p 'chia_plot_k34-*.exe' -O "$GITHUB_WORKSPACE/madmax/cactus_plot_k34.exe"

      - name: Get bladebit plotter
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_BLADEBIT=$(gh api repos/Chia-Network/bladebit/releases/latest --jq 'select(.prerelease == false) | .tag_name')
          mkdir -p "$GITHUB_WORKSPACE/bladebit"
          cd "$GITHUB_WORKSPACE/bladebit"
          gh release download -R Chia-Network/bladebit "$LATEST_BLADEBIT" -p 'bladebit*windows-x86-64.zip'
          find . -maxdepth 1 -name '*.zip' -print0 | xargs -0 -I{} bash -c 'unzip -o {} && rm {}'

      - name: Build GUI
        # HAS_SIGNING_SECRET is unset -> signing steps are skipped
        shell: pwsh
        run: |
          .\venv\Scripts\Activate.ps1
          cd build_scripts
          .\build_windows-1-gui.ps1

      # puts editbin.exe (and signtool.exe) on PATH for the installer script
      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build installer
        shell: pwsh
        run: |
          .\venv\Scripts\Activate.ps1
          cd build_scripts
          .\build_windows-2-installer.ps1

      - name: Sign artifacts
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then echo "No GPG key configured; skipping"; exit 0; fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          command -v sha256sum >/dev/null || sha256sum() { shasum -a 256 "$@"; }
          cd cactus-blockchain-gui/release-builds/windows-installer
          for f in *; do
            case "$f" in *.sha256|*.asc) continue;; esac
            sha256sum "$f" > "$f.sha256"
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --armor --detach-sign "$f"
          done
          ls -la

      # build_windows-2-installer.ps1 copies the setup exe here, not to
      # build_scripts/final_installer like the other platforms
      - uses: actions/upload-artifact@v4
        with:
          name: cactus-installers-windows-x64
          path: cactus-blockchain-gui/release-builds/windows-installer/
          if-no-files-found: error

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: cactus-blockchain-gui/release-builds/windows-installer/*
