name: 📦🚀 Build Installer - Linux DEB

on:
  push:
    tags: ["**"]
    branches: ["main", "chia-2.7.3-port"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build DEB (${{ matrix.os.arch }})
    runs-on: ${{ matrix.os.runs-on }}
    # Build inside Chia's ubuntu-22.04 builder image (like upstream) so the
    # pyinstaller binaries link against glibc 2.35 and run on Ubuntu 22.04+ /
    # Debian 12+. Building directly on ubuntu-latest (24.04) produced daemons
    # requiring GLIBC_2.38 that crash on older distros.
    container: chianetwork/ubuntu-22.04-builder:python312
    strategy:
      fail-fast: false
      matrix:
        os:
          - runs-on: ubuntu-latest
            arch: amd64
            madmax-suffix: x86-64
            bladebit-suffix: ubuntu-x86-64.tar.gz
          - runs-on: ubuntu-24.04-arm
            arch: arm64
            madmax-suffix: arm64
            bladebit-suffix: ubuntu-arm64.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # dynamic version needs tags
          submodules: recursive

      # container checkouts leave the workspace owned by a different uid
      - name: Mark git workspace safe
        run: git config --global --add safe.directory '*'

      # python 3.12 comes from the builder image; setup-python would install
      # a runner-targeted build instead

      - uses: actions/setup-node@v4
        with:
          node-version-file: "cactus-blockchain-gui/.nvmrc"

      # app-builder has no bundled icon-conversion helper or fpm on arm64 and
      # falls back to the system opj_decompress / fpm; the container runs as
      # root, plain runners need sudo
      - name: Install icon and packaging tooling
        run: |
          if command -v sudo >/dev/null; then SUDO=sudo; else SUDO=""; fi
          $SUDO apt-get update && $SUDO apt-get install -y libopenjp2-tools
          command -v fpm >/dev/null || $SUDO gem install fpm --no-document

      - name: Install cactus-blockchain
        uses: ./.github/actions/install
        with:
          python-version: "3.12"
          development: "true"
        env:
          PIP_EXTRA_INDEX_URL: https://pypi.chia.net/simple/

      - name: Set installer version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "CACTUS_INSTALLER_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            # Match the version the bundled daemon reports so the GUI does not
            # show its mismatched-versions warning on untagged builds
            # (PEP440 2.5.1.dev1 -> semver 2.5.1-dev1; both compare equal in the GUI).
            PKG_VERSION=$(venv/bin/python -c "import importlib.metadata as m; print(m.version('cactus-blockchain'))")
            echo "CACTUS_INSTALLER_VERSION=$(echo "$PKG_VERSION" | sed 's/\.dev/-dev/')" >> "$GITHUB_ENV"
          fi

      - name: Get madmax plotter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Cactus-Network's plotter forks are gone; madmax/bladebit are
          # network-agnostic, so bundle Chia's builds under the names the
          # cactus.plotters code expects.
          LATEST_MADMAX=$(gh api repos/Chia-Network/chia-plotter-madmax/releases/latest --jq 'select(.prerelease == false) | .tag_name')
          mkdir -p "$GITHUB_WORKSPACE/madmax"
          gh release download -R Chia-Network/chia-plotter-madmax "$LATEST_MADMAX" -p 'chia_plot-*-${{ matrix.os.madmax-suffix }}' -O "$GITHUB_WORKSPACE/madmax/cactus_plot"
          gh release download -R Chia-Network/chia-plotter-madmax "$LATEST_MADMAX" -p 'chia_plot_k34-*-${{ matrix.os.madmax-suffix }}' -O "$GITHUB_WORKSPACE/madmax/cactus_plot_k34"
          chmod +x "$GITHUB_WORKSPACE"/madmax/cactus_plot "$GITHUB_WORKSPACE"/madmax/cactus_plot_k34

      - name: Get bladebit plotter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_BLADEBIT=$(gh api repos/Chia-Network/bladebit/releases/latest --jq 'select(.prerelease == false) | .tag_name')
          ASSETS=$(gh release view "$LATEST_BLADEBIT" --repo Chia-Network/bladebit --json assets -q '.assets[].name')
          if ! echo "$ASSETS" | grep -q 'bladebit.*-${{ matrix.os.bladebit-suffix }}'; then
            LATEST_BLADEBIT=v2.0.1
          fi
          mkdir -p "$GITHUB_WORKSPACE/bladebit"
          cd "$GITHUB_WORKSPACE/bladebit"
          gh release download -R Chia-Network/bladebit "$LATEST_BLADEBIT" -p 'bladebit*-${{ matrix.os.bladebit-suffix }}'
          find . -maxdepth 1 -name '*.tar.gz' -print0 | xargs -0 -I{} bash -c 'tar -xzf {} && rm {}'
          find . -maxdepth 1 -name 'bladebit*' -print0 | xargs -0 -I{} chmod +x {}

      - name: Build GUI
        run: |
          . ./venv/bin/activate
          cd build_scripts
          bash build_linux_deb-1-gui.sh

      - name: Build installer
        run: |
          . ./venv/bin/activate
          cd build_scripts
          bash build_linux_deb-2-installer.sh ${{ matrix.os.arch }}

      - name: Sign artifacts
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then echo "No GPG key configured; skipping"; exit 0; fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          # passphrase is optional (key may be unprotected); trim paste artifacts
          GPG_PASSPHRASE=$(printf '%s' "$GPG_PASSPHRASE" | tr -d '[:space:]')
          PASSARGS=()
          if [ -n "$GPG_PASSPHRASE" ]; then PASSARGS=(--pinentry-mode loopback --passphrase "$GPG_PASSPHRASE"); fi
          command -v sha256sum >/dev/null || sha256sum() { shasum -a 256 "$@"; }
          cd build_scripts/final_installer
          for f in *; do
            case "$f" in *.sha256|*.asc) continue;; esac
            sha256sum "$f" > "$f.sha256"
            gpg --batch --yes "${PASSARGS[@]}" --armor --detach-sign "$f"
          done
          ls -la

      - uses: actions/upload-artifact@v7
        with:
          name: cactus-installers-deb-${{ matrix.os.arch }}
          path: build_scripts/final_installer/
          if-no-files-found: error

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: build_scripts/final_installer/*
