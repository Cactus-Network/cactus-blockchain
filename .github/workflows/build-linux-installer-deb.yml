name: 📦🚀 Build Installer - Linux DEB

on:
  push:
    tags: ["**"]
    branches: ["main", "chia-2.7.3-port"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build DEB (${{ matrix.os.arch }})
    runs-on: ${{ matrix.os.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - runs-on: ubuntu-latest
            arch: amd64
          - runs-on: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # dynamic version needs tags
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version-file: "cactus-blockchain-gui/.nvmrc"

      # app-builder has no bundled icon-conversion helper on arm64 and falls
      # back to the system opj_decompress
      - name: Install icon tooling
        run: sudo apt-get update && sudo apt-get install -y libopenjp2-tools

      - name: Install cactus-blockchain
        uses: ./.github/actions/install
        with:
          python-version: "3.12"
          development: "true"
        env:
          PIP_EXTRA_INDEX_URL: https://pypi.chia.net/simple/

      - name: Set installer version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "CACTUS_INSTALLER_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "CACTUS_INSTALLER_VERSION=0.0.0" >> "$GITHUB_ENV"
          fi

      - name: Build GUI
        run: |
          . ./venv/bin/activate
          cd build_scripts
          bash build_linux_deb-1-gui.sh

      - name: Build installer
        run: |
          . ./venv/bin/activate
          cd build_scripts
          bash build_linux_deb-2-installer.sh ${{ matrix.os.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: cactus-installers-deb-${{ matrix.os.arch }}
          path: build_scripts/final_installer/

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: build_scripts/final_installer/*
