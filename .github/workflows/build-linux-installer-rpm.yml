name: 📦🚀 Build Installer - Linux RPM

on:
  push:
    tags: ["**"]
    branches: ["main", "chia-2.7.3-port"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build RPM (x86_64)
    # NOTE: built on ubuntu-latest, so the pyinstaller binaries need its glibc
    # or newer on the target distro. Chia builds in a rocky8 container for
    # wider compat — switch `container: chianetwork/rocky8-builder:latest`
    # here if old-distro support is requested.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version-file: "cactus-blockchain-gui/.nvmrc"

      - name: Install rpm tooling
        # fpm packages the CLI rpm (runner ruby is new enough); libopenjp2-tools
        # mirrors the deb workflow (app-builder icon conversion fallback).
        run: |
          sudo apt-get update && sudo apt-get install -y rpm libopenjp2-tools
          command -v fpm >/dev/null || sudo gem install fpm --no-document

      - name: Install cactus-blockchain
        uses: ./.github/actions/install
        with:
          python-version: "3.12"
          development: "true"
        env:
          PIP_EXTRA_INDEX_URL: https://pypi.chia.net/simple/

      - name: Set installer version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "CACTUS_INSTALLER_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            # Match the version the bundled daemon reports so the GUI does not
            # show its mismatched-versions warning on untagged builds
            # (PEP440 2.5.1.dev1 -> semver 2.5.1-dev1; both compare equal in the GUI).
            PKG_VERSION=$(venv/bin/python -c "import importlib.metadata as m; print(m.version('cactus-blockchain'))")
            echo "CACTUS_INSTALLER_VERSION=$(echo "$PKG_VERSION" | sed 's/\.dev/-dev/')" >> "$GITHUB_ENV"
          fi

      - name: Get madmax plotter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Cactus-Network's plotter forks are gone; madmax/bladebit are
          # network-agnostic, so bundle Chia's builds under the names the
          # cactus.plotters code expects.
          LATEST_MADMAX=$(gh api repos/Chia-Network/chia-plotter-madmax/releases/latest --jq 'select(.prerelease == false) | .tag_name')
          mkdir -p "$GITHUB_WORKSPACE/madmax"
          gh release download -R Chia-Network/chia-plotter-madmax "$LATEST_MADMAX" -p 'chia_plot-*-x86-64' -O "$GITHUB_WORKSPACE/madmax/cactus_plot"
          gh release download -R Chia-Network/chia-plotter-madmax "$LATEST_MADMAX" -p 'chia_plot_k34-*-x86-64' -O "$GITHUB_WORKSPACE/madmax/cactus_plot_k34"
          chmod +x "$GITHUB_WORKSPACE"/madmax/cactus_plot "$GITHUB_WORKSPACE"/madmax/cactus_plot_k34

      - name: Get bladebit plotter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_BLADEBIT=$(gh api repos/Chia-Network/bladebit/releases/latest --jq 'select(.prerelease == false) | .tag_name')
          ASSETS=$(gh release view "$LATEST_BLADEBIT" --repo Chia-Network/bladebit --json assets -q '.assets[].name')
          if ! echo "$ASSETS" | grep -q 'bladebit.*-centos-x86-64.tar.gz'; then
            LATEST_BLADEBIT=v2.0.1
          fi
          mkdir -p "$GITHUB_WORKSPACE/bladebit"
          cd "$GITHUB_WORKSPACE/bladebit"
          gh release download -R Chia-Network/bladebit "$LATEST_BLADEBIT" -p 'bladebit*-centos-x86-64.tar.gz'
          find . -maxdepth 1 -name '*.tar.gz' -print0 | xargs -0 -I{} bash -c 'tar -xzf {} && rm {}'
          find . -maxdepth 1 -name 'bladebit*' -print0 | xargs -0 -I{} chmod +x {}

      - name: Build GUI
        run: |
          . ./venv/bin/activate
          cd build_scripts
          bash build_linux_rpm-1-gui.sh

      - name: Build installer
        run: |
          . ./venv/bin/activate
          cd build_scripts
          bash build_linux_rpm-2-installer.sh amd64

      - uses: actions/upload-artifact@v4
        with:
          name: cactus-installers-rpm-x86_64
          path: build_scripts/final_installer/
          if-no-files-found: error

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: build_scripts/final_installer/*
