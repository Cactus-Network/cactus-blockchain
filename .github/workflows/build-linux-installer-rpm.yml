name: 📦🚀 Build Installer - Linux RPM

on:
  push:
    tags: ["**"]
    branches: ["main", "chia-2.7.3-port"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build RPM (x86_64)
    # NOTE: built on ubuntu-latest, so the pyinstaller binaries need its glibc
    # or newer on the target distro. Chia builds in a rocky8 container for
    # wider compat — switch `container: chianetwork/rocky8-builder:latest`
    # here if old-distro support is requested.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version-file: "cactus-blockchain-gui/.nvmrc"

      - name: Install rpm tooling
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install cactus-blockchain
        uses: ./.github/actions/install
        with:
          python-version: "3.12"
          development: "true"
        env:
          PIP_EXTRA_INDEX_URL: https://pypi.chia.net/simple/

      - name: Set installer version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "CACTUS_INSTALLER_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "CACTUS_INSTALLER_VERSION=0.0.0" >> "$GITHUB_ENV"
          fi

      - name: Build GUI
        run: |
          . ./venv/bin/activate
          cd build_scripts
          bash build_linux_rpm-1-gui.sh

      - name: Build installer
        run: |
          . ./venv/bin/activate
          cd build_scripts
          bash build_linux_rpm-2-installer.sh amd64

      - uses: actions/upload-artifact@v4
        with:
          name: cactus-installers-rpm-x86_64
          path: build_scripts/final_installer/

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: build_scripts/final_installer/*
