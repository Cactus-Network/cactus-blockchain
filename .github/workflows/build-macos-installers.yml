name: 📦🚀 Build Installer - macOS DMG

on:
  push:
    tags: ["**"]
    branches: ["main", "chia-2.7.3-port"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build DMG (${{ matrix.os.arch }})
    runs-on: ${{ matrix.os.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - runs-on: macos-13
            arch: intel
          - runs-on: macos-latest
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install cactus-blockchain
        uses: ./.github/actions/install
        with:
          python-version: "3.12"
          development: "true"
        env:
          PIP_EXTRA_INDEX_URL: https://pypi.chia.net/simple/

      - name: Set installer version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "CACTUS_INSTALLER_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "CACTUS_INSTALLER_VERSION=0.0.0" >> "$GITHUB_ENV"
          fi

      - name: Build GUI
        # NOTARIZE is unset -> unsigned build; CSC disabled so electron-builder
        # does not look for a signing identity on the runner.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          . ./venv/bin/activate
          cd build_scripts
          bash build_macos-1-gui.sh

      - name: Build installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          . ./venv/bin/activate
          cd build_scripts
          bash build_macos-2-installer.sh

      - uses: actions/upload-artifact@v4
        with:
          name: cactus-installers-macos-${{ matrix.os.arch }}
          path: build_scripts/final_installer/

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: build_scripts/final_installer/*
