name: 📦🚀 Build Installer - macOS DMG

on:
  push:
    tags: ["**"]
    branches: ["main", "chia-2.7.3-port"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build DMG (${{ matrix.os.arch }})
    runs-on: ${{ matrix.os.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        os:
          # macos-13 was retired by GitHub (jobs queue forever); macos-15-intel
          # is the remaining Intel label (available through Aug 2027)
          - runs-on: macos-15-intel
            arch: intel
            madmax-suffix: macos-intel
            bladebit-suffix: macos-x86-64.tar.gz
          - runs-on: macos-latest
            arch: arm64
            madmax-suffix: macos-m1
            bladebit-suffix: macos-arm64.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version-file: "cactus-blockchain-gui/.nvmrc"

      - name: Install cactus-blockchain
        uses: ./.github/actions/install
        with:
          python-version: "3.12"
          development: "true"
        env:
          PIP_EXTRA_INDEX_URL: https://pypi.chia.net/simple/

      - name: Set installer version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "CACTUS_INSTALLER_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            # Match the version the bundled daemon reports so the GUI does not
            # show its mismatched-versions warning on untagged builds
            # (PEP440 2.5.1.dev1 -> semver 2.5.1-dev1; both compare equal in the GUI).
            PKG_VERSION=$(venv/bin/python -c "import importlib.metadata as m; print(m.version('cactus-blockchain'))")
            echo "CACTUS_INSTALLER_VERSION=$(echo "$PKG_VERSION" | sed 's/\.dev/-dev/')" >> "$GITHUB_ENV"
          fi

      - name: Get madmax plotter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Cactus-Network's plotter forks are gone; madmax/bladebit are
          # network-agnostic, so bundle Chia's builds under the names the
          # cactus.plotters code expects.
          LATEST_MADMAX=$(gh api repos/Chia-Network/chia-plotter-madmax/releases/latest --jq 'select(.prerelease == false) | .tag_name')
          mkdir -p "$GITHUB_WORKSPACE/madmax"
          gh release download -R Chia-Network/chia-plotter-madmax "$LATEST_MADMAX" -p 'chia_plot-*-${{ matrix.os.madmax-suffix }}' -O "$GITHUB_WORKSPACE/madmax/cactus_plot"
          gh release download -R Chia-Network/chia-plotter-madmax "$LATEST_MADMAX" -p 'chia_plot_k34-*-${{ matrix.os.madmax-suffix }}' -O "$GITHUB_WORKSPACE/madmax/cactus_plot_k34"
          chmod +x "$GITHUB_WORKSPACE"/madmax/cactus_plot "$GITHUB_WORKSPACE"/madmax/cactus_plot_k34

      - name: Get bladebit plotter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_BLADEBIT=$(gh api repos/Chia-Network/bladebit/releases/latest --jq 'select(.prerelease == false) | .tag_name')
          # newer bladebit releases dropped macOS assets; fall back like upstream
          ASSETS=$(gh release view "$LATEST_BLADEBIT" --repo Chia-Network/bladebit --json assets -q '.assets[].name')
          if ! echo "$ASSETS" | grep -q 'bladebit.*-${{ matrix.os.bladebit-suffix }}'; then
            LATEST_BLADEBIT=v2.0.1
          fi
          mkdir -p "$GITHUB_WORKSPACE/bladebit"
          cd "$GITHUB_WORKSPACE/bladebit"
          gh release download -R Chia-Network/bladebit "$LATEST_BLADEBIT" -p 'bladebit*-${{ matrix.os.bladebit-suffix }}'
          find . -maxdepth 1 -name '*.tar.gz' -print0 | xargs -0 -I{} bash -c 'tar -xzf {} && rm {}'
          find . -maxdepth 1 -name 'bladebit*' -print0 | xargs -0 -I{} chmod +x {}

      - name: Build GUI
        # NOTARIZE is unset -> unsigned build; CSC disabled so electron-builder
        # does not look for a signing identity on the runner.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          . ./venv/bin/activate
          cd build_scripts
          bash build_macos-1-gui.sh

      - name: Build installer
        # NOTARIZE flips on automatically once the Apple signing secrets exist;
        # without them the build falls back to the ad-hoc-signed path.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          NOTARIZE: ${{ secrets.APPLE_DEV_ID_APP != '' }}
          APPLE_DEV_ID_APP: ${{ secrets.APPLE_DEV_ID_APP }}
          APPLE_DEV_ID_APP_PASS: ${{ secrets.APPLE_DEV_ID_APP_PASS }}
          APPLE_NOTARIZE_USERNAME: ${{ secrets.APPLE_NOTARIZE_USERNAME }}
          APPLE_NOTARIZE_PASSWORD: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          . ./venv/bin/activate
          cd build_scripts
          bash build_macos-2-installer.sh

      - name: Sign artifacts
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then echo "No GPG key configured; skipping"; exit 0; fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          command -v sha256sum >/dev/null || sha256sum() { shasum -a 256 "$@"; }
          cd build_scripts/final_installer
          for f in *; do
            case "$f" in *.sha256|*.asc) continue;; esac
            sha256sum "$f" > "$f.sha256"
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --armor --detach-sign "$f"
          done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: cactus-installers-macos-${{ matrix.os.arch }}
          path: build_scripts/final_installer/
          if-no-files-found: error

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: build_scripts/final_installer/*
