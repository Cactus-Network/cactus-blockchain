# Cactus explorer — nginx site config.
#
#   sudo cp deploy/nginx-explorer.conf /etc/nginx/sites-available/explorer
#   sudo ln -s /etc/nginx/sites-available/explorer /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d explorer.cactus-network.net   # adds the TLS blocks
#
# If nginx (www-data) cannot traverse /home/sgroiwes, either:
#   chmod o+x /home/sgroiwes /home/sgroiwes/cactus-blockchain
# or copy explorer/web to /var/www/cactus-explorer and change root below.

server {
    listen 80;
    listen [::]:80;
    server_name explorer.cactus-network.net;

    root /home/sgroiwes/cactus-blockchain/explorer/web;

    # Allow iframing ONLY from the main site (and the explorer itself).
    # Do not also set X-Frame-Options: it has no allow-list form and would
    # conflict; modern browsers honor frame-ancestors.
    add_header Content-Security-Policy "frame-ancestors 'self' https://www.cactus-network.net https://cactus-network.net" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # JSON API -> uvicorn.  No trailing slash on proxy_pass: the /api prefix is
    # preserved and matched by FastAPI's own /api router prefix.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    # Vendored libs are immutable (replace the file to change them).
    location /vendor/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # App shell + assets.  js/css are referenced as ?v=N — bump on deploy.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "public, max-age=300";
        add_header Content-Security-Policy "frame-ancestors 'self' https://www.cactus-network.net https://cactus-network.net" always;
    }
}
